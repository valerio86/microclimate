[project]
name = "microclimate"
version = "0.1.0"
description = "Localized weather forecasting from a personal weather station and air quality sensor"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.0",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "python-dotenv>=1.0",
    # DuckDB needs pytz to hand TIMESTAMPTZ values back to Python.
    "pytz>=2024.1",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]
analysis = ["matplotlib>=3.8", "scikit-learn>=1.5"]

[project.scripts]
microclimate = "microclimate.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microclimate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
